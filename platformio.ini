; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
description = esp32 c++ V17 Project to save gas on heatup only when needed with web configuration

[env:usb]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_port = COM3
;build_unflags = -std=gnu++11 ;required, to deactivate old default
build_unflags =
	-std=gnu++11
	-fno-lto
build_flags =
	-Wno-deprecated-declarations
	-std=gnu++17
	-flto
	-DCM_ENABLE_LIVE_UI=1
	-DCM_ENABLE_LOGGING=0
	-DCM_ENABLE_VERBOSE_LOGGING=0
	-DCM_LOGGING_LEVEL=CM_LOG_LEVEL_WARN
lib_deps =
	bblanchon/ArduinoJson@^7.4.3
	esphome/ESPAsyncWebServer-esphome@^3.2.2
	esphome/AsyncTCP-esphome@2.1.4
	knolleary/PubSubClient@^2.8
	paulstoffregen/OneWire@^2.3.7
	milesburton/DallasTemperature@^4.0.6
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit SSD1306@2.5.16
	vitaly.ruhl/ESP32 Configuration Manager@4.10.5
test_ignore = src/main.cpp
extra_scripts =
	pre:./tools/precompile_wrapper.py


[env:ota]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
;build_unflags = -std=gnu++11 ;required, to deactivate old default
build_unflags =
	-std=gnu++11
	-fno-lto
build_flags =
	-Wno-deprecated-declarations
	-std=gnu++17
	-flto
	-DCM_ENABLE_LIVE_UI=1
	-DCM_ENABLE_LOGGING=0
	-DCM_ENABLE_VERBOSE_LOGGING=0
	-DCM_LOGGING_LEVEL=CM_LOG_LEVEL_WARN
lib_deps =
	bblanchon/ArduinoJson@^7.4.3
	esphome/ESPAsyncWebServer-esphome@^3.2.2
	esphome/AsyncTCP-esphome@2.1.4
	knolleary/PubSubClient@^2.8
	paulstoffregen/OneWire@^2.3.7
	milesburton/DallasTemperature@^4.0.6
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit SSD1306@2.5.16
	vitaly.ruhl/ESP32 Configuration Manager@4.10.5
test_ignore = src/main.cpp
extra_scripts =
	pre:./tools/precompile_wrapper.py

upload_protocol = espota
upload_port = 192.168.2.130
;upload_flags = --auth=ota1234 -t 120 -c 512
upload_flags =
    -a
    ota1234
    -t
    60
; Isolated COM8 bench only; never use this environment for production OTA.
[env:bench]
extends = env:usb
upload_port = COM8
build_flags =
    ${env:usb.build_flags}
    -DBOILERSAVER_BENCH_TEST=1


; Operator-mapped station diagnostic; relay pins19/27/23 stay reserved. Never production or OTA.
[env:bench_full_io]
extends = env:usb
upload_port = COM8
build_flags =
    ${env:usb.build_flags}
    -DBOILERSAVER_BENCH_TEST=1
    -DBOILERSAVER_BENCH_FULL_IO=1


; Private CM freeze for reviewed COM8-only testing. Do not upload before parent review.
[env:bench_cm_fix]
extends = env:bench_full_io
build_flags =
    ${env:bench_full_io.build_flags}
    -DBOILERSAVER_BENCH_CM_FIX=1
lib_ignore =
    ESPAsyncWebServer-esphome
    AsyncTCP-esphome
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0
    knolleary/PubSubClient@2.8
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit SSD1306@2.5.16
    adafruit/Adafruit BusIO@1.17.4
    file://test/fixtures/cm-4.10.6-test-b3cfc50834d8.tar.gz
